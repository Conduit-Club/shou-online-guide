<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1184" viewBox="0 0 1440 1184" role="img" aria-labelledby="title description">
<title id="title">海大2025级计算机科学与技术方向：150学分组成图</title>
<desc id="description">四年毕业最低150学分：通识选修6、通识必修7、公共基础37、学科基础36、方向必修10、专业选修至少15、专业实践39。创新创业教育2学分包含在通识必修7学分内，不另加；各类要求须分别完成。具体分项见图中文字及正文表格。</desc>

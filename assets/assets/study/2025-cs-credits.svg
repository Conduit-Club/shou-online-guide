<text x="40" y="89" font-size="40" fill="#183d4d" font-weight="700" dominant-baseline="central" text-anchor="start">大学四年的学分，分成这 7 块</text>
<text x="40" y="136" font-size="23" fill="#516873" font-weight="400" dominant-baseline="central" text-anchor="start">2025 级 · 计算机科学与技术专业（计算机科学与技术方向）</text>

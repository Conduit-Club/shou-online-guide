<text x="304" y="1028" font-size="29" fill="#365b8c" font-weight="700" dominant-baseline="central" text-anchor="start">39 学分</text>
<text x="624" y="215" font-size="22" fill="#183d4d" font-weight="400" dominant-baseline="central" text-anchor="start">海洋环境与生态文明 1  ·  科学精神与科学技术 1</text>
<text x="624" y="250" font-size="22" fill="#183d4d" font-weight="400" dominant-baseline="central" text-anchor="start">政治文明与社会建设 2  ·  人文经典与艺术审美 2</text>
<text x="624" y="279" font-size="18" fill="#607581" font-weight="400" dominant-baseline="central" text-anchor="start">其中：四史类 1、美育类 2；计科另有限选要求</text>
<text x="624" y="344" font-size="22" fill="#183d4d" font-weight="400" dominant-baseline="central" text-anchor="start">职业发展与就业指导 1  ·  心理健康教育 2</text>
<text x="624" y="391" font-size="22" fill="#183d4d" font-weight="400" dominant-baseline="central" text-anchor="start">社会实践 2</text>
<rect x="850" y="369" width="326" height="44" rx="8" fill="#fff0db" stroke="#e7b571"/>
<text x="1013" y="391" font-size="23" fill="#99510d" font-weight="700" dominant-baseline="central" text-anchor="middle">创新创业教育 2 学分</text>
<text x="624" y="431" font-size="18" fill="#99510d" font-weight="400" dominant-baseline="central" text-anchor="start">创新的 2 学分已含在这 7 学分里，不另加。</text>
<text x="624" y="497" font-size="22" fill="#183d4d" font-weight="400" dominant-baseline="central" text-anchor="start">思政 15  ·  英语 6  ·  军体 6 ＝ 27</text>
<text x="624" y="533" font-size="22" fill="#183d4d" font-weight="400" dominant-baseline="central" text-anchor="start">人工智能导论 1  ·  线代 B 2  ·  概统 3  ·  物理 B 4 ＝ 10</text>
<text x="624" y="561" font-size="18" fill="#607581" font-weight="400" dominant-baseline="central" text-anchor="start">数学、物理等配置随专业变化；本图列计科要求</text>
<text x="624" y="624" font-size="23" fill="#183d4d" font-weight="400" dominant-baseline="central" text-anchor="start">高等数学、程序设计、离散数学等</text>
<text x="624" y="663" font-size="22" fill="#183d4d" font-weight="400" dominant-baseline="central" text-anchor="start">数据结构与算法、组成原理、操作系统、网络、数据库等</text>
<text x="624" y="736" font-size="22" fill="#183d4d" font-weight="400" dominant-baseline="central" text-anchor="start">计算机系统基础（上、下）4  ·  算法设计与分析 2</text>
<text x="624" y="775" font-size="22" fill="#183d4d" font-weight="400" dominant-baseline="central" text-anchor="start">生成式 AI 应用架构 2  ·  软件工程 2</text>
<text x="624" y="848" font-size="23" fill="#183d4d" font-weight="400" dominant-baseline="central" text-anchor="start">按方向限选要求修读，再选择其他专业选修课</text>
<text x="624" y="887" font-size="21" fill="#607581" font-weight="400" dominant-baseline="central" text-anchor="start">注意数学建模、高级程序设计、编译原理、信息安全等备注</text>
<text x="624" y="961" font-size="23" fill="#183d4d" font-weight="400" dominant-baseline="central" text-anchor="start">模块一 6 ＋ 本方向模块二 8 ＋ 模块三 25</text>
<text x="624" y="999" font-size="23" fill="#183d4d" font-weight="400" dominant-baseline="central" text-anchor="start">模块三：综合实习 12 ＋ 毕业设计（论文）13</text>
<text x="624" y="1035" font-size="18" fill="#607581" font-weight="400" dominant-baseline="central" text-anchor="start">理论课与对应课程设计分别计学分，都要完成</text>
<polyline points="40,1084 1400,1084" fill="none" stroke="#d7e1e8" stroke-width="2"/>
<text x="40" y="1115" font-size="22" fill="#183d4d" font-weight="700" dominant-baseline="central" text-anchor="start">先看类别，再看总数：各类学分不能随意互相顶替。</text>
<text x="40" y="1153" font-size="18" fill="#607581" font-weight="400" dominant-baseline="central" text-anchor="start">依据：上海海洋大学《2025级教学一览》通识课程设置、计科印刷页 424–429  ·  核验：2026-09-11</text>
